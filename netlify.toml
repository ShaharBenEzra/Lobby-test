# הגדרות Netlify לדשבורד.
#
# publish = "."          → האתר הוא הקבצים בשורש הריפו (אין שלב build)
# functions = "netlify/functions"  → כאן יושבת פונקציית הניהול
#
# ⚠️  אין כאן שום סוד. הסיסמה וה-token של GitHub נקבעים בממשק של Netlify
#     (Site configuration → Environment variables) ולעולם לא בריפו.
#     ראו ADMIN_SETUP.md.

[build]
  publish = "."
  functions = "netlify/functions"

# קבצי התוכן הם המקור החי שכל מסך מושך כל שתי דקות - אסור שיישבו
# ב-cache של הדפדפן או של ה-CDN, אחרת עדכון של הוועד "לא יגיע" למסך.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
