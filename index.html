<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lobby Dashboard</title>

    <!-- האתר מנהל בהיר/כהה בעצמו (ערכות הצבעים). בלי השורה הזו WebView של אנדרואיד
         (Fully Kiosk) עלול "להכהות" בכוח גם ערכה בהירה כשהמכשיר במצב כהה -->
    <meta name="color-scheme" content="light dark">

    <!--
        דף אחד לכל הבניינים ולכל הסקינים. ההסבר המלא: README.md ו-core/dashboard.js.

          sites/<בניין>/   שם, כתובת, קודי QR, הודעות ברירת מחדל, סקין, ערכת צבעים
          skins/<סקין>/    מבנה ה-HTML, ה-CSS ו-3 ערכות צבעים
          core/            כל הלוגיקה - משותפת לכולם

        הסקין נבחר רק בחלון הניהול (לשונית "תצוגה").
        לבדיקה: ?site=tormus8  ?theme=auto

        רענון אוטומטי כל 4 שעות - core/auto_refresh.js (ולא meta refresh), כדי
        שאפשר יהיה להשהות אותו כשחלון הניהול פתוח.
    -->

    <!-- אייקונים משותפים: Material Symbols (חלון הניהול, מסך המנוי ורוב הסקינים)
         ו-Font Awesome (אייקוני סטטוס הבניין שהוועד בוחר) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..400,0,0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- 1. הליבה + רשימת הבניינים + רשימת הסקינים -->
    <script src="core/dashboard.js"></script>
    <script src="sites/sites.js"></script>
    <script src="skins/skins.js"></script>

    <!-- 2. הבניין: sites/<בניין>/site.js + הודעות וסטטוס ברירת מחדל -->
    <script>Dashboard.loadSite();</script>

    <!-- 3. הסקין שהוועד בחר (או של הבניין): skins/<סקין>/skin.js, שטוען את ה-CSS והגופנים שלו -->
    <script>Dashboard.loadSkin();</script>

    <!-- 4. מנוי - כאן ב-head כדי שהדשבורד לא יהבהב לפני שהוא מוסתר -->
    <script src="core/subscription_guard.js"></script>
</head>

<body>

    <!-- נגן אחד לשני המקורות (גלגלצ / מוזיקת הבית) - ראו core/radio.js.
         preload="none" מבטיח שקובץ המוזיקה לא נטען בכלל עד שלוחצים play -->
    <audio id="lobby-audio" preload="none"></audio>

    <!-- ערכת הצבעים על ה-body, ואז מבנה ה-HTML של הסקין (layout ב-skin.js) -->
    <script>Dashboard.mount();</script>

    <!-- ═══════════════════════════════════════════
         הליבה - ממלאת את המבנה בנתונים. כל קובץ מחפש את האלמנטים שלו
         לפי id, ומדלג בשקט על מה שאין בסקין.

         stage_scale.js   מתאים את #tv-stage (1280x720) לגודל המסך בסקייל אחיד
         keep_alive.js    Screen Wake Lock - המסך לא נרדם
         auto_refresh.js  רענון הדף כל 4 שעות
         clock.js         שעון, תאריך, תאריך עברי
         weather.js       open-meteo.com - מזג אוויר ותחזית 7 ימים
         hebcal.js        hebcal.com - זמני שבת, פרשה, מועדים
         news.js          בר החדשות של Ynet
         radio.js         גלגלצ / מוזיקת הבית
    ════════════════════════════════════════════ -->
    <script src="core/stage_scale.js"></script>
    <script src="core/keep_alive.js"></script>
    <script src="core/auto_refresh.js"></script>
    <script src="core/clock.js"></script>
    <script src="core/weather.js"></script>
    <script src="core/hebcal.js"></script>
    <script src="core/news.js"></script>
    <script src="core/radio.js"></script>

    <!-- ⚠️  סדר הטעינה חשוב: הגדרות → שכבת הנתונים → ציור → חלון הניהול -->
    <script src="core/admin_config.js"></script>
    <script src="core/admin_store.js"></script>
    <script src="core/notices.js"></script>
    <script src="core/status.js"></script>
    <script src="core/admin_panel.js"></script>

    <!-- קודי QR מקישור - מ-unpkg (cdnjs חסום בחלק מהרשתות) -->
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="core/qr.js"></script>
    <script src="core/side_image.js"></script>
    <script src="core/themes.js"></script>

</body>
</html>
